name: CI

# Lint + build only, for both frontend and backend, on every push and PR.
# Deliberately does NOT run the backend's test suite (backend/tests/*) —
# per the implementation plan this repo's automation follows, no phase of
# this rollout runs automated tests, and that includes CI. If test runs
# are wanted here later, add a separate, explicitly-opted-in workflow
# rather than folding them into this one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build succeeds without real secrets —
          # this job only verifies the build compiles, it doesn't deploy.
          VITE_API_URL: https://example.com
          VITE_SITE_URL: https://example.com

  backend:
    name: Backend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
