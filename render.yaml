# Render Blueprint — codifies service config so it's version-controlled
# instead of living only in the Dashboard. Deploy via Render Dashboard ->
# New -> Blueprint, pointing at this repo.
#
# NOTE: Render static sites do NOT read a `_redirects` file (that's a
# Netlify/Cloudflare Pages convention). The `routes` rewrite rule below
# is what actually makes client-side routes (e.g. /about) work on
# direct load and on refresh — without it every non-root path 404s.
services:
  - type: web
    name: gervasportfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: gervasportfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
